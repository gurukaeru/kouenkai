<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>七日間の審判 ― クリーンに戦って、勝て。</title>
<style>
:root{
  --washi:#F5F1E6;
  --washi-deep:#EDE7D6;
  --sumi:#23211C;
  --sumi-soft:#5A5648;
  --shu:#C0392B;
  --shu-deep:#96281B;
  --ai:#2B4A6F;
  --kin:#B8933D;
  --line:#D8D0BC;
  --ok:#3E7C4F;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;}
body{
  background:var(--washi);
  background-image:
    radial-gradient(rgba(0,0,0,.018) 1px, transparent 1px),
    radial-gradient(rgba(255,255,255,.35) 1px, transparent 1px);
  background-size:7px 7px, 11px 11px;
  color:var(--sumi);
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;
  line-height:1.65;
  min-height:100vh;
}
.serif{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;}

/* ── 紅白幕 ── */
.kouhaku{
  height:26px;
  background:repeating-linear-gradient(90deg,
    var(--shu) 0 44px, #FBF8F0 44px 88px);
  border-bottom:3px solid var(--sumi);
  position:relative;
}
.kouhaku::after{
  content:"";position:absolute;left:0;right:0;bottom:-9px;height:6px;
  background:repeating-linear-gradient(90deg, transparent 0 40px, rgba(0,0,0,.06) 40px 88px);
}

.wrap{max-width:760px;margin:0 auto;padding:0 14px 90px;}

/* ── ステータスバー ── */
#statusbar{
  position:sticky;top:0;z-index:50;
  background:rgba(245,241,230,.96);
  backdrop-filter:blur(3px);
  border-bottom:2px solid var(--sumi);
  padding:8px 10px 7px;
  display:none;
}
#statusbar.on{display:block;}
.sb-inner{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:center;}
.sb-daruma{flex:0 0 46px;}
.sb-stats{flex:1;display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px 12px;}
.sb-row{display:flex;align-items:center;gap:6px;font-size:11px;}
.sb-row .lbl{width:3.2em;color:var(--sumi-soft);letter-spacing:.05em;flex:none;}
.bar{flex:1;height:8px;background:var(--washi-deep);border:1px solid var(--line);border-radius:4px;overflow:hidden;}
.bar i{display:block;height:100%;border-radius:3px;transition:width .5s ease;}
.bar .nin{background:var(--shu);}
.bar .jib{background:var(--ai);}
.bar .sei{background:var(--ok);}
.bar .tai{background:var(--kin);}
.bar .shin{background:#8A5FA0;}
.sb-money{grid-column:1/-1;display:flex;justify-content:space-between;font-size:12px;font-weight:700;}
.sb-money .kin-v{font-variant-numeric:tabular-nums;}
.sb-turn{font-size:11px;color:var(--sumi-soft);}

/* ── 画面共通 ── */
.screen{padding:26px 4px 10px;animation:fadein .45s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
h1.title{
  font-size:clamp(38px,9vw,64px);
  letter-spacing:.12em;text-align:center;line-height:1.25;
  margin:18px 0 4px;font-weight:700;
}
h1.title .shu-c{color:var(--shu);}
.subtitle{text-align:center;color:var(--sumi-soft);letter-spacing:.28em;font-size:13px;margin-bottom:26px;}
h2.ph{
  font-size:22px;letter-spacing:.1em;font-weight:700;
  border-left:6px solid var(--shu);padding-left:12px;margin-bottom:4px;
}
.ph-sub{color:var(--sumi-soft);font-size:13px;margin-bottom:18px;padding-left:18px;}
.card{
  background:#FCFAF3;border:1.5px solid var(--sumi);border-radius:6px;
  padding:16px 18px;margin-bottom:14px;
  box-shadow:3px 3px 0 rgba(35,33,28,.12);
}
.card h3{font-size:15px;margin-bottom:6px;letter-spacing:.06em;}
.note{font-size:12.5px;color:var(--sumi-soft);}
.tag{display:inline-block;font-size:10.5px;border:1px solid currentColor;border-radius:3px;padding:0 6px;margin-right:5px;letter-spacing:.08em;}
.tag.shu{color:var(--shu-deep);}
.tag.ai{color:var(--ai);}
.tag.ok{color:var(--ok);}
.tag.kin{color:#8a6d23;}

/* ── アクションボタン ── */
.acts{display:grid;grid-template-columns:1fr;gap:9px;margin-top:12px;}
@media(min-width:560px){.acts{grid-template-columns:1fr 1fr;}}
button{font-family:inherit;}
.act{
  text-align:left;background:#FCFAF3;border:1.5px solid var(--sumi);
  border-radius:6px;padding:11px 13px;cursor:pointer;
  box-shadow:2px 2px 0 rgba(35,33,28,.14);
  transition:transform .08s, box-shadow .08s;
}
.act:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:3px 3px 0 rgba(35,33,28,.2);}
.act:active:not(:disabled){transform:translate(1px,1px);box-shadow:none;}
.act:disabled{opacity:.42;cursor:not-allowed;}
.act .a-name{font-weight:700;font-size:14.5px;display:flex;justify-content:space-between;gap:6px;}
.act .a-cost{font-size:11px;color:var(--shu-deep);white-space:nowrap;}
.act .a-fx{font-size:11.5px;color:var(--sumi-soft);margin-top:3px;}
.btn-main{
  display:block;width:100%;margin:20px auto 0;padding:14px;
  background:var(--shu);color:#FFF;border:2px solid var(--sumi);border-radius:6px;
  font-size:17px;font-weight:700;letter-spacing:.22em;cursor:pointer;
  box-shadow:3px 3px 0 var(--sumi);
  transition:transform .08s, box-shadow .08s;
}
.btn-main:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--sumi);}
.btn-main:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--sumi);}
.btn-sub{
  display:inline-block;padding:9px 20px;background:#FCFAF3;color:var(--sumi);
  border:1.5px solid var(--sumi);border-radius:6px;font-size:14px;font-weight:700;
  cursor:pointer;box-shadow:2px 2px 0 rgba(35,33,28,.2);
}

/* ── ログ ── */
#log{margin-top:16px;}
.log-e{
  font-size:12.5px;padding:7px 10px;border-left:3px solid var(--line);
  background:rgba(255,255,255,.5);margin-bottom:5px;border-radius:0 4px 4px 0;
}
.log-e.good{border-left-color:var(--ok);}
.log-e.bad{border-left-color:var(--shu);}
.log-e.info{border-left-color:var(--ai);}

/* ── モーダル ── */
#modal-bg{
  position:fixed;inset:0;background:rgba(35,33,28,.55);z-index:100;
  display:none;align-items:center;justify-content:center;padding:16px;
}
#modal-bg.on{display:flex;}
#modal{
  background:var(--washi);border:2.5px solid var(--sumi);border-radius:8px;
  max-width:520px;width:100%;max-height:86vh;overflow-y:auto;
  padding:22px 22px 18px;box-shadow:6px 6px 0 rgba(35,33,28,.3);
  animation:fadein .3s ease;
}
#modal .m-tag{
  display:inline-block;background:var(--sumi);color:var(--washi);
  font-size:11px;letter-spacing:.2em;padding:2px 10px;border-radius:3px;margin-bottom:10px;
}
#modal .m-tag.hanketsu{background:var(--shu-deep);}
#modal h3{font-size:18px;margin-bottom:10px;line-height:1.5;}
#modal p{font-size:14px;margin-bottom:12px;}
#modal .m-quote{
  font-size:14.5px;background:#FCFAF3;border:1px solid var(--line);
  border-radius:6px;padding:12px 14px;margin-bottom:14px;
}
.m-choice{
  display:block;width:100%;text-align:left;margin-bottom:9px;
  background:#FCFAF3;border:1.5px solid var(--sumi);border-radius:6px;
  padding:12px 14px;font-size:14px;font-weight:700;cursor:pointer;
  box-shadow:2px 2px 0 rgba(35,33,28,.18);
}
.m-choice:hover{transform:translate(-1px,-1px);}
.kaisetsu{
  background:#FFF;border:1.5px dashed var(--ai);border-radius:6px;
  padding:12px 14px;font-size:13px;margin:12px 0;
}
.kaisetsu .k-h{color:var(--ai);font-weight:700;font-size:12px;letter-spacing:.15em;margin-bottom:4px;}
.jobun{font-size:11.5px;color:var(--sumi-soft);margin-top:6px;}

/* ── フェーズ2グリッド ── */
.koma-strip{display:flex;gap:5px;margin:10px 0 16px;flex-wrap:wrap;}
.koma{
  flex:1;min-width:52px;text-align:center;font-size:11px;padding:5px 2px;
  border:1.5px solid var(--line);border-radius:5px;background:#FCFAF3;color:var(--sumi-soft);
}
.koma.now{border-color:var(--shu);background:var(--shu);color:#FFF;font-weight:700;}
.koma.done{background:var(--washi-deep);text-decoration:line-through;}

/* ── 開票 ── */
.kaihyo-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
.kaihyo-rate{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;}
table.kaihyo{width:100%;border-collapse:collapse;font-size:13px;}
table.kaihyo th{
  text-align:left;font-size:11px;color:var(--sumi-soft);
  border-bottom:2px solid var(--sumi);padding:4px 6px;letter-spacing:.1em;
}
table.kaihyo td{padding:5px 6px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;}
tr.me{background:rgba(192,57,43,.09);font-weight:700;}
tr.me td:first-child{border-left:4px solid var(--shu);}
.tousen-mark{color:var(--shu);font-weight:700;font-size:11px;letter-spacing:.05em;}
.rakusen-mark{color:var(--sumi-soft);font-size:11px;}
tr.cutline td{border-bottom:2.5px dashed var(--shu-deep);}

/* ── 結果 ── */
.result-banner{
  text-align:center;padding:30px 10px 22px;margin:14px 0;
  border:2.5px solid var(--sumi);border-radius:8px;background:#FCFAF3;
  box-shadow:4px 4px 0 rgba(35,33,28,.18);
}
.result-banner .rb-big{font-size:clamp(40px,10vw,66px);letter-spacing:.15em;font-weight:700;line-height:1.3;}
.result-banner .win{color:var(--shu);}
.result-banner .lose{color:var(--ai);}
.uchiwake{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px;}
.uchiwake td,.uchiwake th{padding:5px 8px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;}
.uchiwake th{text-align:left;font-weight:400;color:var(--sumi-soft);}

.daruma-stage{text-align:center;margin:8px 0 2px;}
.me-eye{animation:eyein .7s cubic-bezier(.2,1.6,.4,1) both;transform-box:fill-box;transform-origin:center;}
@keyframes eyein{0%{transform:scale(0);}70%{transform:scale(1.35);}100%{transform:scale(1);}}
.center{text-align:center;}
.small{font-size:12px;color:var(--sumi-soft);}
.hr{border:none;border-top:1.5px dashed var(--line);margin:16px 0;}
.fukidashi{
  position:relative;background:#FFF;border:1.5px solid var(--sumi);border-radius:8px;
  padding:12px 15px;font-size:14px;margin:10px 0 4px;
}
.fukidashi::before{
  content:"";position:absolute;top:-9px;left:26px;width:14px;height:14px;
  background:#FFF;border-left:1.5px solid var(--sumi);border-top:1.5px solid var(--sumi);
  transform:rotate(45deg);
}
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important;}
}

/* ── v2: シーン/声/チップ ── */
.scene-card{border-width:2px;}
.scene-setup{font-size:15px;line-height:1.9;}
.voices{margin-top:12px;border-top:1.5px dashed var(--line);padding-top:9px;}
.voices .v-h{font-size:10.5px;letter-spacing:.25em;color:var(--sumi-soft);margin-bottom:5px;}
.v-line{font-size:13.5px;color:var(--sumi-soft);margin-bottom:4px;animation:fadein .5s ease both;}
.v-line:nth-child(3){animation-delay:.15s;}
.v-line:nth-child(4){animation-delay:.3s;}
.fx-chip{display:inline-block;font-size:11.5px;font-weight:700;border-radius:4px;padding:2px 8px;margin:2px 4px 2px 0;border:1px solid;}
.fx-chip.plus{color:var(--ok);border-color:var(--ok);background:rgba(62,124,79,.07);}
.fx-chip.minus{color:var(--shu-deep);border-color:var(--shu-deep);background:rgba(150,40,27,.06);}
.news-line{background:#FFF;border:1.5px solid var(--ai);border-radius:6px;padding:10px 13px;font-size:13.5px;margin:10px 0;}
.tension{margin-top:10px;padding:8px 12px;border:1.5px solid var(--shu-deep);border-radius:6px;background:rgba(192,57,43,.05);font-size:13px;font-variant-numeric:tabular-nums;font-weight:700;text-align:center;}
#tokaku-ov{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:rgba(35,33,28,.35);pointer-events:none;}
.tokaku-stamp{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:min(26vw,150px);font-weight:700;color:var(--shu);border:6px double var(--shu);border-radius:12px;padding:6px 30px;background:rgba(245,241,230,.94);letter-spacing:.15em;transform:rotate(-8deg);animation:stampin .55s cubic-bezier(.2,1.5,.4,1) both;box-shadow:0 10px 40px rgba(35,33,28,.35);}
@keyframes stampin{0%{transform:rotate(-8deg) scale(3);opacity:0;}60%{transform:rotate(-8deg) scale(.92);opacity:1;}100%{transform:rotate(-8deg) scale(1);}}
.confetti{position:fixed;top:-14px;width:9px;height:15px;z-index:201;animation:cfall linear both;pointer-events:none;}
@keyframes cfall{to{transform:translateY(110vh) rotate(720deg);}}
</style>
</head>
<body>
<div class="kouhaku"></div>

<div id="statusbar">
  <div class="sb-inner">
    <div class="sb-daruma" id="sb-daruma"></div>
    <div class="sb-stats">
      <div class="sb-row"><span class="lbl">認知度</span><div class="bar"><i class="nin" id="b-nin"></i></div></div>
      <div class="sb-row"><span class="lbl">地盤</span><div class="bar"><i class="jib" id="b-jib"></i></div></div>
      <div class="sb-row"><span class="lbl">政策</span><div class="bar"><i class="sei" id="b-sei"></i></div></div>
      <div class="sb-row"><span class="lbl">体力</span><div class="bar"><i class="tai" id="b-tai"></i></div></div>
      <div class="sb-row"><span class="lbl">信頼</span><div class="bar"><i class="shin" id="b-shin"></i></div></div>
      <div class="sb-row sb-turn" id="sb-turn"></div>
      <div class="sb-money"><span>資金</span><span class="kin-v" id="b-kin"></span></div>
    </div>
  </div>
</div>

<div class="wrap"><div id="app"></div></div>

<div id="modal-bg"><div id="modal"></div></div>

<script>
"use strict";
/* ══════════════════════════════════════════
   七日間の審判 v2 ― シーン駆動型
   すべてのターンが「事件」になる
   ══════════════════════════════════════════ */

const $ = id => document.getElementById(id);
const app = $("app");
const yen = n => "¥" + Math.round(n).toLocaleString("ja-JP");
const rnd = (a,b) => a + Math.random()*(b-a);
const pick = arr => arr[Math.floor(Math.random()*arr.length)];

let S = null;
function newGame(){
  S = {
    phase: 0, week: 1, day: 1,
    nin: 6, jib: 4, sei: 12,
    tai: 100, shin: 50, kin: 1000000,
    hōtei: 0, chishiki: 0, ihan: 0, donated: 0,
    policies: [],
    gear: {car:false, uguisu:false, bira:false, tel:false},
    weather: [],
    sotaD: 0,        // 颯太の得票変動
    gouwanAtk: false, // 岩城の敵対フラグ
    kaichō: false,    // 商店街会長の支持
    useCount: {},
    prepPaid: false, loan: false,
    gameOver: false,
  };
}
const HOTEI_JOGEN = 2400000;

function gain(cur, amt){
  if(amt >= 0) return Math.min(100, cur + amt * (1 - cur/160));
  return Math.max(0, cur + amt);
}

/* ── ステータスバー ── */
function renderSB(turnText){
  $("statusbar").classList.add("on");
  $("b-nin").style.width = S.nin + "%";
  $("b-jib").style.width = S.jib + "%";
  $("b-sei").style.width = S.sei + "%";
  $("b-tai").style.width = S.tai + "%";
  $("b-shin").style.width = S.shin + "%";
  $("b-kin").textContent = yen(S.kin);
  $("sb-turn").textContent = turnText || "";
  $("sb-daruma").innerHTML = darumaSVG(46, true, false);
}

function openModal(html){ $("modal").innerHTML = html; $("modal-bg").classList.add("on"); $("modal").scrollTop = 0; }
function closeModal(){ $("modal-bg").classList.remove("on"); }

/* ── 有権者の声 ── */
const VOICES = {
  low_nin: ["「誰、この人?」","「ポスター…見たことあったかなぁ」","「名前が読めん」"],
  mid_nin: ["「駅で毎朝見るわ、あの人」","「最近よう名前を聞くな」","「ああ、あの軽トラの人か」"],
  jiban: ["「大森会長がえらい気に入っとるらしい」","「うちの店にも顔出してくれたよ」","「若いのに義理堅いんだと」"],
  sei: ["「介護の話、やけに具体的だったな」","「学童の件、ちゃんと覚えててくれた」","「数字で話す候補は珍しい」"],
  shin: ["「あの人は断るときも筋を通すらしい」","「金の匂いがせんのがいい」","「クリーンだけで飯が食えるかね……でも嫌いじゃない」"],
  rain: ["「この雨の中もやっとるわ……」","「傘もささんと。風邪ひくぞ」"],
  neg: ["「若いもんの綺麗事に聞こえるがな」","「で、結局なにをしてくれるの?」"],
};
function voicesHTML(keys){
  const lines = [];
  keys.forEach(k=>{
    if(VOICES[k]) lines.push(pick(VOICES[k]));
    else lines.push(k); // 直接文字列も可
  });
  if(S.nin < 20 && !keys.includes("low_nin")) lines.push(pick(VOICES.low_nin));
  return `<div class="voices"><div class="v-h">── 街の声 ──</div>` +
    lines.slice(0,3).map(l=>`<div class="v-line serif">${l}</div>`).join("") + `</div>`;
}

/* ── 変化量の表示 ── */
function fxApply(fx, tai, cost){
  S.tai = Math.max(0, Math.min(100, S.tai - (tai||0)));
  S.kin -= (cost||0);
  const label = {nin:"認知度",jib:"地盤",sei:"政策浸透",shin:"信頼"};
  const parts = [];
  for(const k in (fx||{})){
    const before = S[k];
    if(k === "shin") S.shin = Math.max(0, Math.min(100, S.shin + fx[k]));
    else S[k] = gain(S[k], fx[k]);
    const d = S[k] - before;
    if(Math.abs(d) >= 0.5) parts.push(`${label[k]}${d>0?"+":""}${d.toFixed(0)}`);
  }
  if(tai > 0) parts.push(`体力−${tai}`);
  if(tai < 0) parts.push(`体力+${-tai}`);
  if(cost > 0) parts.push(`−${yen(cost)}`);
  return parts.map(p=>`<span class="fx-chip ${p.includes("−")&&!p.includes("体力")?"minus":p.includes("+")?"plus":"minus"}">${p}</span>`).join("");
}

/* ══════════════ タイトル ══════════════ */
function scTitle(){
  $("statusbar").classList.remove("on");
  app.innerHTML = `
  <div class="screen center">
    <p class="subtitle serif" style="margin:30px 0 0;">地盤なし・看板なし・カバンなし</p>
    <h1 class="title serif">七日間の<span class="shu-c">審判</span></h1>
    <p class="subtitle">CLEAN CAMPAIGN, REAL VICTORY</p>
    <div class="daruma-stage">${darumaSVG(130, true, false)}</div>
    <p class="small" style="margin-top:-4px;">左目に願をかけた。右目は、当選の夜に。</p>
    <div class="card" style="text-align:left;max-width:520px;margin:22px auto 14px;">
      <p style="font-size:13.5px;">人口5.7万人の地方都市・みなみ市。市議選は<b>定数18に候補24人</b>。
      あなたは組織も知名度もない新人。立ちはだかるのは6期目の実力者<b>・岩城剛三</b>、
      そして同じ最終議席を狙うもう一人の新人<b>・水島颯太</b>。<br>
      武器は自己資金<b>100万円</b>と、二本の足。90日の仕込みと7日間の勝負で、
      <b>1,000票</b>を積み上げろ。</p>
      <hr class="hr">
      <p class="note">⚖ 誘いのなかには公職選挙法の罠が<b>予告なく</b>混ざります。見抜いて断ることが、信頼と票になります。違反3回で摘発、すべてが終わります。</p>
    </div>
    <button class="btn-main" style="max-width:340px;" onclick="startGame()">出 馬 表 明</button>
    <p class="small" style="margin-top:14px;">※ 制度・金額は学習用に簡略化したモデルです</p>
  </div>`;
}

function startGame(){ newGame(); S.phase = 0.5; scPolicy(); }

function scPolicy(){
  $("statusbar").classList.remove("on");
  const rows = POLICIES.map(p=>{
    const sel = S.policies.includes(p.id);
    const full = !sel && S.policies.length >= 2;
    const bars = ["18-29","30-49","50-64","65+"].map((g,i)=>{
      const v = p.m[i];
      const c = v >= 1.15 ? "var(--shu)" : v >= 1.03 ? "var(--kin)" : v <= 0.92 ? "var(--ai)" : "var(--line)";
      return `<span style="display:inline-block;margin-right:7px;font-size:10.5px;color:var(--sumi-soft);">${g}<b style="color:${c};"> ${v>=1.15?"◎":v>=1.03?"○":v<=0.92?"▲":"−"}</b></span>`;
    }).join("");
    return `<button class="act" ${full?"disabled":""} onclick="togglePol('${p.id}')" style="${sel?"background:#FBEBE7;border-color:var(--shu);":""}">
      <div class="a-name"><span>${sel?"☑ ":"☐ "}${p.name}</span></div>
      <div class="a-fx">${p.desc}</div>
      <div class="a-fx" style="margin-top:4px;">${bars}</div>
    </button>`;
  }).join("");
  app.innerHTML = `
  <div class="screen">
    <h2 class="ph serif">出馬表明 ── 何を掲げて立つのか</h2>
    <p class="ph-sub">重点政策を<b>2つ</b>選ぶ(${S.policies.length}/2)。年代ごとに響き方が違う。</p>
    <div class="acts" style="grid-template-columns:1fr;">${rows}</div>
    <div class="card" style="margin-top:14px;">
      <p class="note">◎=強く響く ○=響く −=普通 ▲=響きにくい<br>
      政策は掲げるだけでは票になりません。<b>「政策浸透」が育つほど補正が効きます</b>。
      最大の票田は65歳以上(1.9万人×投票率70%)。そして無名では、組織も政策も動きません。</p>
    </div>
    <button class="btn-main" ${S.policies.length===2?"":"disabled style='opacity:.4;'"} onclick="confirmPolicy()">この二本柱で出馬する</button>
  </div>`;
}
function togglePol(id){
  if(S.policies.includes(id)) S.policies = S.policies.filter(x=>x!==id);
  else if(S.policies.length < 2) S.policies.push(id);
  scPolicy();
}
function confirmPolicy(){
  if(S.policies.length !== 2) return;
  S.p1seq = buildP1Seq();
  S.phase = 1;
  scP1();
}

  app.innerHTML = `

function chooseP1(i){
  const sc = S.p1seq[S.week-1];
  resolveChoice(sc.choices[i], ()=> afterP1Scene());
}

/* ── シーン解決(共通) ── */
function resolveChoice(c, next){
  window._next = next;
  /* 罠 */
  if(c.trap){
    S.kin -= (c.cost||0);
    return violationFlow(KAISETSU[c.trap], next);
  }
  /* 判定ロール */
  if(c.roll){
    const r = c.roll;
    const p = Math.max(0.15, Math.min(0.9, 0.3 + (S[r.stat] - r.diff)/55));
    const win = Math.random() < p;
    const o = win ? r.win : r.lose;
    const chips = fxApply(Object.assign({}, c.fx, o.fx), c.tai, c.cost);
    if(o.flag) S[o.flag] = true;
    if(o.sota) S.sotaD += o.sota;
    if(c.kchi){ S.chishiki++; S.shin = Math.min(100, S.shin+6); }
    return outcomeModal(win ? "成 功" : "失 敗", win, o.res, chips, c.voices, next);
  }
  /* 通常 */
  const chips = fxApply(c.fx, c.tai, c.cost);
  if(c.flag) S[c.flag] = true;
  if(c.sota) S.sotaD += c.sota;
  if(c.kchi){ S.chishiki++; S.shin = Math.min(100, S.shin+6); }
  outcomeModal(null, true, c.res, chips, c.voices, next);
}

function outcomeModal(rollLabel, ok, res, chips, voices, next){
  window._next = next;
  openModal(`
    ${rollLabel ? `<span class="m-tag ${ok?"":"hanketsu"}" style="${ok?"background:var(--ok);":""}">判定|${rollLabel}</span>` : ""}
    <p class="m-quote serif" style="font-size:14.5px;">${res}</p>
    <div style="margin:10px 0;">${chips}</div>
    ${voices ? voicesHTML(voices) : ""}
    <button class="m-choice" onclick="closeModal(); window._next();">つづける</button>
  `);
}

/* ── 違反フロー(3ストライク) ── */
function violationFlow(k, next){
  S.ihan++;
  S.shin = Math.max(0, S.shin - 15);
  if(S.ihan >= 3){ closeModal(); return scBusted(); }
  const stage = S.ihan === 1
    ? {tag:"警告", txt:"後日、選挙管理委員会から<b>注意</b>を受けた。今回は指導で済んだが、記録は残り、<b>信頼だけを失った</b>。"}
    : {tag:"事情聴取", txt:"警察から<b>任意の事情聴取</b>。地元紙に小さく記事が載り、SNSで広まっていく。<b>次はない。</b>"};
  if(S.ihan === 2) S.nin = Math.max(0, S.nin - 8);
  window._next = next;
  openModal(`
    <span class="m-tag hanketsu">${stage.tag}|違反${S.ihan}回目</span>
    <h3 class="serif">それは、公職選挙法違反だった</h3>
    <p>${stage.txt}</p>
    <div class="kaisetsu"><div class="k-h">解説|${k.title}</div>${k.body}<div class="jobun">▶ ${k.jobun}</div></div>
    <button class="m-choice" onclick="closeModal(); window._next();">深く反省する</button>
  `);
}

  const news = NEWS_P1[S.week-1];

const GEARS = [

  {id:"uguisu", name:"車上運動員(ウグイス嬢)",        cost:100000, note:"選挙カーの効果1.5倍。法定日当の範囲で雇用。", req:"car"},
  {id:"bira",   name:"法定ビラ4,000枚+証紙貼り",      cost:80000,  note:"街頭作戦にビラ配布が付き、効果が上がる。"},
  {id:"tel",    name:"電話作戦ブース(回線+名簿)",     cost:50000,  note:"作戦「電話作戦」解禁。地盤を固める合法な個別接触。"},
];

function scPrep(){
  S.phase = 1.5;
  if(!S.prepPaid){
    S.prepPaid = true;
    S.kin -= 450000;
    S.hōtei += 150000;
    if(S.kin < 0){ S.loan = true; }
  }
  renderSB("告示前夜|選挙準備");
  const rows = GEARS.map(g=>{
    const owned = S.gear[g.id];
    const reqNG = g.req && !S.gear[g.req];
    const poor = S.kin < g.cost;
    const dis = owned||reqNG||poor ? "disabled":"";
    return `<button class="act" ${dis} onclick="buyGear('${g.id}')">
      <div class="a-name"><span>${owned?"✔ ":""}${g.name}</span><span class="a-cost">${owned?"手配済":yen(g.cost)}</span></div>
      <div class="a-fx">${g.note}${reqNG?" ── <b>先に選挙カーが必要</b>":""}${(!owned&&poor)?" ── <b>資金不足</b>":""}</div>
    </button>`;
  }).join("");
  app.innerHTML = `
  <div class="screen">
    <h2 class="ph serif">告示前夜 ── 装備を整えろ</h2>
    <p class="ph-sub">90日で集めた資金が、七日間の選択肢に変わる。</p>
    <div class="card">
      <h3>必須支出(支払済)</h3>
      <p style="font-size:13.5px;">供託金 <b>¥300,000</b>(規定得票で返還)/ ポスター印刷・掲示 <b>¥150,000</b></p>
      <p class="note">使える残資金:<b>${yen(S.kin)}</b>${S.loan?"(親族から借入で補填。収支報告に記載)":""}。
      日々の運行費・会場費も残しておくこと。法定上限 ${yen(HOTEI_JOGEN)}。</p>
    </div>
    <div class="acts" style="grid-template-columns:1fr;">${rows}</div>
    <button class="btn-main" onclick="startP2()">告示日を迎える(7日間へ)</button>
  </div>`;
}
function buyGear(id){
  const g = GEARS.find(x=>x.id===id);
  S.kin -= g.cost; S.hōtei += g.cost;
  S.gear[id] = true;
  scPrep();
}

const TACTICS = [
  {id:"gaito", name:"駅頭+街頭演説ハシゴ", tai:20, cost:0, fx:{nin:4.5,sei:3}, outdoor:true, note:"肉声で語り、握手で締める。体力勝負。", biraBonus:true},
  {id:"enzetsu",name:"個人演説会(夜)", tai:14, cost:20000, fx:{sei:6.5,jib:3.5}, note:"会場費はかかるが、深く刺さる。"},
  {id:"tel",   name:"電話作戦", gear:"tel", tai:10, cost:6000, fx:{jib:6}, note:"支援者名簿を電話で締める。天候不問。"},
  {id:"sns",   name:"SNS集中デー", tai:8, cost:0, fx:{nin:3,sei:3}, note:"ライブ配信と拡散依頼。若年層に届く。"},
  {id:"rest",  name:"半日休養+作戦会議", tai:-30, cost:0, fx:{}, note:"倒れたら終わり。守りも戦術。"},
];

function startP2(){
  S.phase = 2; S.day = 1;
  S.tai = Math.min(100, S.tai + 30);
  S.weather = Array.from({length:7}, ()=> Math.random() < 0.25);
  S.p2seq = buildP2Seq();
  scDayPlan();
}

function scDayPlan(){
  renderSB(`フェーズ2|${S.day}日目 / 全7日`);
  const rain = S.weather[S.day-1];
  const cards = TACTICS.map(t=>{
    const noGear = t.gear && !S.gear[t.gear];
    const short = t.tai > 0 && S.tai < t.tai;
    const poor = t.cost > 0 && S.kin < t.cost;
    const overcap = t.cost > 0 && S.hōtei + t.cost > HOTEI_JOGEN;
    const dis = (noGear||short||poor||overcap) ? "disabled":"";
    let fx = [];
    if(t.tai>0) fx.push(`体力−${t.tai}`); if(t.tai<0) fx.push(`体力+${-t.tai}`);
    if(t.biraBonus && S.gear.bira) fx.push("証紙ビラ配布つき");
    if(rain && t.outdoor) fx.push('<span style="color:var(--ai);">☔雨×0.65</span>');
    const u = S.useCount[t.id]||0;
    if(t.id!=="rest" && u>0) fx.push(`<span style="color:var(--shu-deep);">飽き×${Math.max(0.4,1-0.15*u).toFixed(2)}</span>`);
    return `<button class="act" ${dis} onclick="chooseTactic('${t.id}')">
      <div class="a-name"><span>${t.name}</span><span class="a-cost">${t.cost?yen(t.cost):"無料"}</span></div>
      <div class="a-fx">${fx.join(" / ")}</div>
      <div class="a-fx">${t.note}${noGear?" ── <b>未手配</b>":""}${short?" ── <b>体力不足</b>":""}${poor?" ── <b>資金不足</b>":""}${overcap?" ── <b>法定上限</b>":""}</div>
    </button>`;
  }).join("");
  app.innerHTML = `
  <div class="screen">
    <h2 class="ph serif">${S.day}日目の朝 ${rain?"☔":"☀"} ── 今日の主戦場は</h2>
    <p class="ph-sub">投票日まであと${8-S.day}日。${rain?"雨。屋外は響きにくい。":""} 法定費用:${yen(S.hōtei)} / ${yen(HOTEI_JOGEN)}</p>
    ${S.gear.car ? `<div class="news-line" style="border-color:var(--kin);">🚗 選挙カー${S.gear.uguisu?"+ウグイス嬢":""}が今日も市内を回る(毎日自動で認知+/運行費¥12,000)</div>` : ""}
    <div class="acts" style="grid-template-columns:1fr;">${cards}</div>
  </div>`;
}

function chooseTactic(id){
  const t = TACTICS.find(x=>x.id===id);
  /* 選挙カーのパッシブ稼働(行動枠を使わない) */
  let carLine = "";
  if(S.gear.car && S.kin >= 12000 && S.hōtei + 12000 <= HOTEI_JOGEN){
    S.kin -= 12000; S.hōtei += 12000;
    const cm = (S.gear.uguisu?1.5:1) * (S.weather[S.day-1]?0.65:1);
    const before = S.nin;
    S.nin = gain(S.nin, 2.4*cm);
    carLine = `<span class="fx-chip plus">選挙カー稼働 認知+${(S.nin-before).toFixed(1)}</span><span class="fx-chip minus">−¥12,000</span>`;
  }
  let mult = 1;
  if(t.id!=="rest") mult *= Math.max(0.4, 1 - 0.15*(S.useCount[id]||0));
  if(S.weather[S.day-1] && t.outdoor) mult *= 0.65;
  const fx = {};
  for(const k in t.fx) fx[k] = t.fx[k]*mult;
  if(t.biraBonus && S.gear.bira){ fx.nin = (fx.nin||0)+1.2; fx.sei = (fx.sei||0)+1; }
  const chips = carLine + fxApply(fx, t.tai, t.cost);
  S.hōtei += t.cost||0;
  if(t.id!=="rest") S.useCount[id] = (S.useCount[id]||0)+1;
  const flavor = {
    gaito:"駅前、スーパー前、交差点。マイクを握った回数だけ、足を止めた顔があった。",
    enzetsu:"夜の会場。集まった数十人の目は真剣だ。演説会に来る人は、誰かに話す人だ。",
    tel:"「はい、はい……ええ、期日前もあるんですよ」。受話器の向こうの一票を、一本ずつ確かめる。",
    sns:"配信のコメント欄が流れていく。画面の向こうの「いいね」は、投票所まで来てくれるだろうか。",
    rest:"事務所の畳で泥のように眠った。夕方、ホワイトボードの得票試算を睨む。あと何票、どこから。",
  }[id];
  const voices = {
    gaito:S.weather[S.day-1]?["rain"]:["mid_nin","sei"], enzetsu:["sei"],
    tel:["jiban"], sns:["「配信見たよ。意外とおもろいやん」"], rest:["「今日は見かけんかったな」"],
  }[id];
  outcomeModal(null, true, flavor, chips, voices, ()=> afterTactic());
}

function afterTactic(){
  if(S.tai <= 0){
    S.tai = 25;
    return openModal(`
      <span class="m-tag hanketsu">過労</span>
      <p class="m-quote serif">演説の途中、視界が白く飛んだ。気づけば救護室。「明日は絶対安静です」──貴重な一日が消えた。</p>
      <button class="m-choice" onclick="closeModal(); endDay(true);">……無念</button>
    `);
  }
  const ev = S.p2seq[S.day];
  if(ev && ev.special === "debate") return runDebateIntro();
  if(ev) return playP2Scene(ev);
  endDay();
}

function answerDebate(i){
  const d = S.debate;
  const o = d.qs[d.i].opts[i];
  const polHit = o.g===2 && o.pol && S.policies.includes(o.pol);
  d.score += o.g===2 ? 1 : o.g===1 ? 0.5 : 0;
  if(o.g===0) d.gaffe++;
  const fx = o.g===2 ? {sei:2.5, nin:1.5} : o.g===1 ? {sei:1} : {shin:-2};
  if(polHit) fx.sei = (fx.sei||0) + 2;
  const chips = fxApply(fx, 0, 0);
  const tag = o.g===2 ? {t:"会心の答え", c:"background:var(--ok);"} : o.g===1 ? {t:"無難な答え", c:"background:var(--kin);"} : {t:"失 言", c:""};
  d.i++;
  openModal(`
    <span class="m-tag ${o.g===0?"hanketsu":""}" style="${tag.c}">${tag.t}${polHit?"|公約と一貫":""}</span>
    <p class="m-quote serif">${o.react}${polHit?"<br><b>掲げた政策と地続きの答えに、説得力が宿った。</b>":""}</p>
    <div style="margin:10px 0;">${chips}</div>
    <button class="m-choice" onclick="closeModal(); ${d.i<5?"scDebateQ()":"debateVerdict()"};">${d.i<5?"次の質問へ":"放送終了"}</button>
  `);
}

/* ══════════════ 得票エンジン ══════════════ */
const DEMO = [
  {name:"18〜29歳", voters:5000,  turnout:0.31, w:s=>(s.nin*0.60 + s.sei*0.40), coef:0.000355},
  {name:"30〜49歳", voters:12000, turnout:0.46, w:s=>(s.sei*0.60 + s.nin*0.40), coef:0.000429},
  {name:"50〜64歳", voters:12000, turnout:0.60, w:s=>(s.jib*0.50 + s.sei*0.28 + s.nin*0.22), coef:0.000503},
  {name:"65歳以上", voters:19000, turnout:0.70, w:s=>(s.jib*0.76 + s.nin*0.24), coef:0.000592},
];
let _lastGate = 1;

function polMult(gi){
  if(S.policies.length === 0) return 1;
  const raw = S.policies.reduce((s,pid)=>s + POLICIES.find(p=>p.id===pid).m[gi], 0) / S.policies.length;
  return 1 + (raw - 1) * Math.min(1, S.sei/70);
}

function calcVotes(){
  const trustMult = 0.85 + S.shin * 0.0035;
  const ninGate = Math.min(1, 0.12 + S.nin/70);
  const kaichōB = S.kaichō ? 1.04 : 1;   // 商店街会長の支持
  const breakdown = DEMO.map((d,i)=>{
    const pm = polMult(i);
    const v = d.voters * d.turnout * d.w(S) * d.coef * trustMult * pm * ninGate * kaichōB * rnd(0.94,1.06);
    return {name:d.name, votes:Math.round(v), cast:Math.round(d.voters*d.turnout), pm};
  });
  const total = breakdown.reduce((s,b)=>s+b.votes,0);
  _lastGate = ninGate;
  const altYoung = Math.round(DEMO[0].voters * 0.70 * DEMO[0].w(S) * DEMO[0].coef * trustMult * polMult(0) * ninGate);
  return {breakdown, total, trustMult, altYoung};
}

const RIVAL_BASE = [1710,1590,1500,1430,1360,1300,1240,1190,1140,1090,1040,1000,960,925,890,858,826,795,760,720,672,610];
const RIVAL_NAMES = ["佐藤一郎","高橋正","田中博","渡辺茂","伊藤誠","山本清","中村勲","小林亮","加藤守","吉田隆","山田要","斎藤実","松本進","井上晃","木村修","林達也","清水健","山口宏","阿部聡","森大介","橋本良","石川陽"];

function buildField(){
  const gouwan = Math.round((S.gouwanAtk ? 1610 : 1690) * rnd(0.97,1.03));
  const sota = Math.max(450, Math.round((840 + S.sotaD) * rnd(0.95,1.05)));
  const cands = [{name:"岩城剛三", final:gouwan, me:false, inc:true, star:"gouwan"}];
  RIVAL_BASE.forEach((b,i)=>{
    cands.push({name:RIVAL_NAMES[i], final:Math.round(b*rnd(0.95,1.05)), me:false, inc:i<14});
  });
  cands.push({name:"水島颯太", final:sota, me:false, inc:false, star:"sota"});
  const my = calcVotes();
  cands.push({name:"あなた", final:my.total, me:true, inc:false});
  return {cands, my};
}

  const steps = [4, 12, 25, 40, 55, 70, 83, 93, 100];
  let idx = 0;
  app.innerHTML = `
  <div class="screen">
    <h2 class="ph serif">開票速報 ── みなみ市議会議員選挙</h2>
    <p class="ph-sub">定数18/候補24|投票率 55.4%</p>
    <div class="card">
      <div class="kaihyo-head">
        <span>開票率</span><span class="kaihyo-rate" id="rate">0%</span>
      </div>
      <div id="board"></div>
    </div>
    <p class="center small" id="count-msg">開票所から第一報を待っています…</p>
  </div>`;
  const sortedF = [...FIELD.cands].sort((a,b)=>b.final-a.final);
  const myRank = sortedF.findIndex(c=>c.me)+1;
  const sotaRank = sortedF.findIndex(c=>c.star==="sota")+1;
  const closeBattle = Math.abs(myRank-18) <= 2 || Math.abs(sotaRank-18) <= 2;
  const msgs = [
    "第一陣の票束が開いた。岩城陣営、早くも万歳の準備か",
    "現職勢が順当に積み上げる",
    "中盤──あなたの名前が読み上げられ始めた",
    "票の山が拮抗している",
    closeBattle ? "当落線上、あなたと水島颯太が数十票差でもつれている" : "当落線上、激しい攻防",
    "終盤──ボーダーが目まぐるしく入れ替わる",
    "残すは期日前投票の開披。事務所は誰も喋らない",
    "最終集計中……",
    "開票終了",
  ];
  const timer = setInterval(()=>{
    const rate = steps[idx];
    drawBoard(rate, idx === steps.length-1);
    $("rate").textContent = rate + "%";
    $("count-msg").textContent = msgs[idx] || "";
    idx++;
    if(idx >= steps.length){
      clearInterval(timer);
      const won = [...FIELD.cands].sort((a,b)=>b.final-a.final).findIndex(c=>c.me) < 18;
      if(won){ setTimeout(showTokaku, 500); setTimeout(scResult, 2600); }
      else setTimeout(scResult, 1800);
    }
  }, 1300);
}

function drawBoard(rate, final){
  const rows = FIELD.cands.map(c=>{
    const counted = final ? c.final : Math.round(c.final * rate/100 * rnd(0.86,1.14));
    return {...c, counted};
  }).sort((a,b)=>b.counted-a.counted);
  const html = `<table class="kaihyo">
    <tr><th>順位</th><th>候補</th><th></th><th style="text-align:right;">得票</th><th></th></tr>
    ${rows.map((c,i)=>{
      const mark = final ? (i<18 ? `<span class="tousen-mark">当</span>` : `<span class="rakusen-mark">落</span>`) : "";
      const nm = c.star==="sota" ? `<b>${c.name}</b>` : c.star==="gouwan" ? `<b>${c.name}</b>` : c.name;
      return `<tr class="${c.me?"me":""} ${i===17?"cutline":""}">
        <td>${i+1}</td><td>${nm}${c.me?" ★":""}</td>
        <td class="small">${c.inc?"現":"新"}</td>
        <td style="text-align:right;">${c.counted.toLocaleString()}</td>
        <td>${mark}</td></tr>`;
    }).join("")}
  </table>
  <p class="small" style="margin-top:6px;">── 点線が当落ライン(18位)──</p>`;
  const meRow = rows.find(r=>r.me);
  const myPos = rows.indexOf(meRow) + 1;
  const lineV = rows[17].counted;
  const diff = meRow.counted - lineV;
  const tension = myPos <= 18
    ? `あなた ${meRow.counted.toLocaleString()}票(${myPos}位)|当落線まで<b style="color:var(--ok);">+${diff.toLocaleString()}票</b>の貯金`
    : `あなた ${meRow.counted.toLocaleString()}票(${myPos}位)|当落線まで<b>あと${(-diff).toLocaleString()}票</b>`;
  $("board").innerHTML = html + `<div class="tension">${tension}</div>`;
}

/* ── 当確演出 ── */
function showTokaku(){
  const ov = document.createElement("div");
  ov.id = "tokaku-ov";
  ov.innerHTML = `<div class="tokaku-stamp">当確</div>`;
  document.body.appendChild(ov);
  const colors = ["#C0392B","#B8933D","#2B4A6F","#F5F1E6"];
  for(let i=0;i<28;i++){
    const c = document.createElement("div");
    c.className = "confetti";
    c.style.left = Math.random()*100 + "vw";
    c.style.background = colors[i%4];
    c.style.animationDuration = (1.6+Math.random()*1.6)+"s";
    c.style.animationDelay = (Math.random()*0.7)+"s";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(), 4200);
  }
  setTimeout(()=>ov.remove(), 2400);
}

/* ══════════════ 結果 ══════════════ */
function scResult(){
  const sorted = [...FIELD.cands].sort((a,b)=>b.final-a.final);
  const rank = sorted.findIndex(c=>c.me) + 1;
  const won = rank <= 18;
  const my = FIELD.my;
  const sota = FIELD.cands.find(c=>c.star==="sota");
  const sotaRank = sorted.findIndex(c=>c.star==="sota")+1;

  let title, sub, cls;
  if(won && rank <= 5){ title="上位当選"; sub="新人としては異例の得票。市政の台風の目になる。"; cls="win"; }
  else if(won && rank <= 15){ title="当 選"; sub="確かな議席。90日と7日の積み重ねが実を結んだ。"; cls="win"; }
  else if(won){ title="滑り込み当選"; sub=`次点との差、わずか${Math.max(1,(my.total - sorted[18].final)).toLocaleString()}票。${sotaRank===19?"敗れた水島颯太が、深夜、事務所に握手に来た。「次は負けません」":"まさに薄氷の勝利だった。"}`; cls="win"; }
  else if(rank === 19){ title="次 点"; sub=`あと${(sorted[17].final - my.total).toLocaleString()}票。${sotaRank<=18?"当選圏に滑り込んだのは水島颯太だった。":""}この悔しさは、4年後の一票目になる。`; cls="lose"; }
  else { title="落 選"; sub="力及ばず。だが得た知識と信頼は消えない。"; cls="lose"; }

  let hotokuLine = "";
  if(S.shin >= 80) hotokuLine = `<p class="serif" style="margin-top:10px;font-size:14px;">「至誠と実行は、最後に報われる」── 信頼 ${S.shin.toFixed(0)} は得票を <b>${((my.trustMult-1)*100).toFixed(0)}%</b> 押し上げた。</p>`;
  else if(S.shin <= 40) hotokuLine = `<p style="margin-top:10px;font-size:13px;">信頼の低さが得票の足を引っ張った(補正 ${((my.trustMult-1)*100).toFixed(0)}%)。クリーンさは倫理であると同時に、戦略でもある。</p>`;

  window._resultCtx = {rank, won, total:my.total, sotaRank, sota};
  renderSB("結果");
  app.innerHTML = `
  <div class="screen">
    <div class="result-banner">
      <p class="small" style="letter-spacing:.3em;">みなみ市議会議員選挙 ── 審判</p>
      <div class="rb-big serif ${cls}">${title}</div>
      <p style="font-size:15px;margin-top:6px;"><b>${my.total.toLocaleString()}票</b>(${rank}位/24人・定数18)</p>
      <div class="daruma-stage">${darumaSVG(130, true, won)}</div>
      <p style="font-size:13.5px;">${won ? "だるまに、両の目が入った。" : "だるまの右目は、まだ白いまま。"}</p>
      <p style="font-size:13.5px;max-width:420px;margin:6px auto 0;">${sub}</p>
    </div>

    <div class="card">
      <h3>ライバルたちの結末</h3>
      <p style="font-size:13.5px;">
      <b>岩城剛三</b>:${sorted.findIndex(c=>c.star==="gouwan")+1}位・${FIELD.cands.find(c=>c.star==="gouwan").final.toLocaleString()}票。${S.gouwanAtk?"あなたとの確執が報じられ、盤石の牙城もわずかに削れた。":"6期目も貫禄の当選。"}<br>
      <b>水島颯太</b>:${sotaRank}位・${sota.final.toLocaleString()}票で${sotaRank<=18?"当選":"落選"}。${S.sotaD<=-40?"あなたとの直接対決での失点が、最後まで響いた。":S.sotaD>=30?"あなたが討論を避けた分の風は、彼に吹いた。":"SNSの風は、投票箱の前でいくらか止んだ。"}</p>
    </div>

    <div class="card">
      <h3>得票の内訳 ── どの世代が、あなたを押し上げたか</h3>
      <table class="uchiwake">
        <tr><th></th><td>投票者数</td><td>政策補正</td><td>あなたの得票</td></tr>
        ${my.breakdown.map(b=>`<tr><th>${b.name}</th><td>${b.cast.toLocaleString()}</td><td>×${b.pm.toFixed(2)}</td><td><b>${b.votes.toLocaleString()}票</b></td></tr>`).join("")}
        <tr><th>合計</th><td></td><td></td><td><b>${my.total.toLocaleString()}票</b></td></tr>
      </table>
      <div class="kaisetsu" style="margin-top:12px;"><div class="k-h">シルバーデモクラシーの数理</div>
      65歳以上は有権者1.9万人×投票率70%。18〜29歳は5千人×31%。同じ「支持率」でも票の重みが数倍違います。
      もし若年投票率が高齢層並み(70%)なら、あなたの若年票は <b>${my.breakdown[0].votes.toLocaleString()}票 → 約${my.altYoung.toLocaleString()}票</b> でした。投票率そのものが、政治の重心を決めています。</div>
    </div>

    <div class="card">
      <h3>戦いの記録</h3>
      <table class="uchiwake">
        <tr><th>重点政策</th><td>${S.policies.map(id=>POLICIES.find(p=>p.id===id).name).join(" / ")}</td></tr>
        <tr><th>最終ステータス</th><td>認知${S.nin.toFixed(0)} / 地盤${S.jib.toFixed(0)} / 政策${S.sei.toFixed(0)}</td></tr>
        <tr><th>信頼</th><td>${S.shin.toFixed(0)} / 100(得票補正 ×${my.trustMult.toFixed(2)})</td></tr>
        ${_lastGate < 0.99 ? `<tr><th>認知ゲート</th><td style="color:var(--shu-deep);">×${_lastGate.toFixed(2)} ── 無名が最後まで足かせに</td></tr>` : ""}
        ${S.kaichō ? `<tr><th>大森会長の支持</th><td>×1.04 ── 商店街が最後に効いた</td></tr>` : ""}
        <tr><th>公選法知識</th><td>${S.chishiki} / 7 ${S.chishiki>=6?"── 見事。もう選対を任せられる":""}</td></tr>
        <tr><th>違反</th><td>${S.ihan}回 ${S.ihan===0?"── 完全クリーン達成":""}</td></tr>
        <tr><th>集めた寄付</th><td>${yen(S.donated)}</td></tr>
        <tr><th>選挙運動費用</th><td>${yen(S.hōtei)} / 上限${yen(HOTEI_JOGEN)}</td></tr>
        <tr><th>供託金</th><td>${my.total >= 140 ? "返還(法定得票クリア)" : "没収(得票が規定に届かず)"}</td></tr>
      </table>
      ${hotokuLine}
    </div>

    <div class="center" style="margin-top:18px;">
      <a class="btn-sub" target="_blank" rel="noopener" href="https://twitter.com/intent/tweet?text=${encodeURIComponent(shareText())}" style="text-decoration:none;display:inline-block;margin:0 5px 10px;">結果をXでシェア</a>
      <button class="btn-sub" style="margin:0 5px 10px;" onclick="navigator.clipboard && navigator.clipboard.writeText(shareText()).then(()=>this.textContent='コピーしました!')">結果をコピー</button>
    </div>
    <button class="btn-main" onclick="scEpilogue()">その後の物語へ</button>
    <button class="btn-sub" style="display:block;margin:12px auto 0;" onclick="scTitle()">タイトルへ戻る</button>
  </div>`;
}

function shareText(){
  const c = window._resultCtx;
  return `【七日間の審判】みなみ市議選(定数18/候補24)、${c.total.toLocaleString()}票で${c.rank}位──${c.won?"当選!":"落選…"} クリーン戦績:違反${S.ihan}回/公選法知識${S.chishiki}/7 #七日間の審判`;
}

/* ══════════════ エピローグ ══════════════ */
function scEpilogue(){
  const c = window._resultCtx;
  const pol = S.policies.map(id=>POLICIES.find(p=>p.id===id).name).join("」と「");
  let body = "";
  if(c.won){
    body += `<p class="scene-setup serif">初登院の朝。議場の一番奥、新人の席にあなたは座った。${c.rank>=16?"18ある椅子の、ぎりぎり端の一脚。だが椅子は椅子だ。":""}</p>`;
    body += `<p class="scene-setup serif">${S.gouwanAtk
      ? "岩城剛三がすれ違いざま、立ち止まった。「……気に食わんが、票は票だ。議場では容赦せんぞ」──それは、老練な男なりの承認だった。"
      : "岩城剛三が声をかけてきた。「若いの、席は用意されるもんじゃない。奪うもんだ。──ようやった」"}</p>`;
    if(c.sotaRank > 18) body += `<p class="scene-setup serif">深夜、水島颯太から短いメッセージが届いていた。「完敗です。でも4年後、僕はもっと強くなってます」──良い敵は、良い薬だ。</p>`;
    body += `<p class="scene-setup serif">最初の一般質問。あなたは「${pol}」を取り上げた。90日と7日、ノートに書き溜めたあの声たちを、初めて公式の議事録に刻む日だ。<br>マイクを引き寄せ、息を吸う。──ここからが、本当の始まりだ。</p>`;
  } else {
    body += `<p class="scene-setup serif">選挙事務所を畳む夜。がらんとした部屋の真ん中で、角の折れたノートを開いた。駅頭の会釈、車座の声、泥の中の長靴──負けても、これは消えない。</p>`;
    if(c.sotaRank <= 18) body += `<p class="scene-setup serif">当選した水島颯太から電話があった。「……正直、あなたが一番怖かった。4年後、また戦いましょう」</p>`;
    body += `<p class="scene-setup serif">${S.shin>=70
      ? "後援会長が最後に言った。「胸を張れ。汚れた勝ちより、綺麗な負けのほうが、次につながる」"
      : "敗因はいくつも思い当たる。それを数えられること自体が、次への装備だ。"}</p>`;
    body += `<p class="scene-setup serif">翌朝。あなたは、また駅前に立っていた。タスキはない。ただ「おはようございます」と頭を下げる。<br>審判は、終わっていない。<b>4年後に、続きがある。</b></p>`;
  }
  if(S.shin >= 80) body += `<p class="scene-setup serif" style="color:var(--sumi-soft);">──誠を尽くした90日と7日は、勝敗がどうであれ、この街の土に還って肥やしになる。</p>`;
  renderSB("エピローグ");
  app.innerHTML = `
  <div class="screen">
    <h2 class="ph serif">${c.won ? "その後 ── 議員一年生" : "その後 ── 審判のつづき"}</h2>
    <div class="card scene-card">${body}</div>
    <div class="center" style="margin-top:14px;">
      <a class="btn-sub" target="_blank" rel="noopener" href="https://twitter.com/intent/tweet?text=${encodeURIComponent(shareText())}" style="text-decoration:none;display:inline-block;margin:0 5px 10px;">結果をXでシェア</a>
    </div>
    <button class="btn-main" onclick="scTitle()">もう一度、審判を受ける</button>
  </div>`;
}

/* ══════════════ 起動 ══════════════ */
scTitle();

</script>
</body>
</html>
