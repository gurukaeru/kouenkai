  <script>
  'use strict';
  const SOURCES={};
  const CATS={town:'まちの輪郭',nomaoi:'野馬追',ancient:'いにしえ',clan:'相馬氏と報徳',modern:'近代の記憶',future:'震災と未来'};
  const Q=[
  ['town','南相馬市が誕生したのはいつ？',['2006年1月1日','1996年1月1日','2011年3月11日'],0,'原町市・小高町・鹿島町が合併し、2006年1月1日に誕生しました。','city'],
  ['town','南相馬市を構成する地域自治区は「原町区・小高区・鹿島区」の3区である。',['○','×'],0,'旧3市町の区域を引き継ぐ、原町・小高・鹿島の3区です。','city'],
  ['town','南相馬市は福島県のどの地域？',['浜通り','中通り','会津'],0,'太平洋に面した浜通り北部、相双地方に位置します。','overview'],
  ['town','南相馬市の北隣にある市は？',['相馬市','いわき市','福島市'],0,'相馬市は北隣。南側は浪江町です。名前が似ていても別の市です。','geography'],
  ['town','南相馬市の「市の木」はマツである。',['○','×'],1,'市の木は「けやき」。防風林や学校、神社の象徴として親しまれてきました。','symbol'],
  ['town','南相馬市の「市の鳥」は？',['ひばり','うぐいす','かもめ'],0,'市の鳥はひばり。雲雀ヶ原の名にもつながる、地域になじみ深い鳥です。','symbol'],
  ['nomaoi','相馬野馬追は現在、毎年何月の最終土・日・月曜日に行われる？',['5月','7月','9月'],0,'人馬の暑さ対策から開催時期が変わり、現在は5月の最終土・日・月曜日です。','nomaoi'],
  ['nomaoi','甲冑競馬と神旗争奪戦の会場は？',['雲雀ヶ原祭場地','小高神社','松川浦'],0,'2日目、原町区の雲雀ヶ原祭場地で行われます。','nomaoi'],
  ['nomaoi','神旗争奪戦では、御神旗は花火で空へ打ち上げられる。',['○','×'],0,'花火とともに打ち上げられ、舞い降りる御神旗を騎馬武者が奪い合います。','flag'],
  ['nomaoi','3日目の「野馬懸」が行われる場所は？',['小高神社','太田神社','中村神社'],0,'小高区の小高神社で行われ、3日間の祭りを締めくくります。','nomaoi'],
  ['nomaoi','野馬懸では、白装束の御小人が馬を素手で捕らえる。',['○','×'],0,'古式を伝える神事で、捕らえた馬を神前に奉納します。','flag'],
  ['nomaoi','相馬野馬追は、国の重要無形民俗文化財に指定されている。',['○','×'],0,'1978年（昭和53年）に国の重要無形民俗文化財へ指定されました。','assets'],
  ['ancient','桜井古墳の形は？',['前方後方墳','前方後円墳','円墳'],0,'四角い墳丘が二つ連なる、東北地方でも有数の規模をもつ前方後方墳です。','sakurai'],
  ['ancient','桜井古墳が造られたとされる時期は？',['4世紀後半','8世紀末','12世紀初め'],0,'出土した土器から、古墳時代前期の4世紀後半に造られたと考えられています。','sakurai'],
  ['ancient','羽山横穴に残るものは？',['彩色された壁画','巨大な木造仏','石造りの天守'],0,'玄室の壁や天井に渦巻や人物などの文様が描かれています。','hayama'],
  ['ancient','浦尻貝塚は弥生時代の遺跡である。',['○','×'],1,'縄文時代の大規模貝塚をもつ中心的なムラの跡です。','odaka'],
  ['ancient','大悲山の石仏がある区は？',['小高区','原町区','鹿島区'],0,'小高区泉沢にあり、薬師堂・阿弥陀堂・観音堂の石仏からなります。','heritage'],
  ['ancient','大悲山の石仏は、平安時代前期の作と推定される。',['○','×'],0,'古く大規模で美術的価値も高い磨崖仏群として国史跡に指定されています。','heritage'],
  ['clan','小高城の跡地に現在建つのは？',['小高神社','小高区役所','博物館'],0,'小高城跡は現在の小高神社境内。土塁や堀の跡も残ります。','odaka'],
  ['clan','小高城は約何年間、奥州相馬氏の本拠だった？',['約280年','約28年','約800年'],0,'鎌倉時代末から江戸時代初めまで、約280年間本拠でした。','odaka'],
  ['clan','相馬氏の居城・中村城は、現在の南相馬市内にある。',['○','×'],1,'中村城は北隣の相馬市にあります。','dokei'],
  ['clan','相馬氏と深く結びつく信仰は？',['妙見信仰','稲荷信仰','熊野信仰'],0,'北極星を中心とする星の信仰である妙見信仰を、相馬氏は精神的なよりどころとしました。','myoken'],
  ['clan','相馬藩の復興に報徳仕法を導入した人物は？',['富田高慶','松尾芭蕉','鈴木安蔵'],0,'二宮尊徳に学んだ藩士・富田高慶が、尊徳に代わって中村藩で仕法を指導しました。','tomita'],
  ['clan','二宮尊徳の伝記『報徳記』を著したのは富田高慶である。',['○','×'],0,'富田高慶は尊徳の死後、その教えを広めるために『報徳記』や『報徳論』を著しました。','tomita'],
  ['modern','原町無線塔が対米無線通信施設として稼働を始めた年は？',['1921年','1945年','1964年'],0,'大正10年（1921年）に稼働を始めた、当時世界有数の国際無線局でした。','radio'],
  ['modern','原町無線塔の高さは約何メートル？',['201m','63m','333m'],0,'鉄筋コンクリート製で高さ201m。原町の空を象徴する存在でした。','radio'],
  ['modern','原町無線塔は現在も当時の姿で立っている。',['○','×'],1,'老朽化のため1982年に解体。現在は記念塔や頭部が記憶を伝えます。','radio'],
  ['modern','原町無線塔が海外へ第一報を伝えた大災害は？',['関東大震災','阪神・淡路大震災','伊勢湾台風'],0,'1923年、関東大震災の惨状をアメリカへ伝えたことで知られます。','radio'],
  ['modern','JRの駅名は「原町駅」である。',['○','×'],1,'駅名は「原ノ町駅」。地名の原町とは表記が異なります。','jr'],
  ['modern','原町無線塔の周囲には、後の大改修で高さ約200mの鉄製副柱が5本建てられた。',['○','×'],0,'1926年から1928年の大改修で、主塔とほぼ同じ高さの鉄製副柱5本が建てられました。','radio'],
  ['future','福島ロボットテストフィールドの開所式が行われた年は？',['2020年','2010年','2025年'],0,'全施設の開所を記念する式典は2020年9月、南相馬市で開かれました。','robot'],
  ['future','福島ロボットテストフィールドは何の研究開発拠点？',['陸・海・空のフィールドロボット','深海魚の養殖','宇宙望遠鏡'],0,'災害対応、無人航空機など陸・海・空のロボットを実証できる拠点です。','robot'],
  ['future','福島ロボットテストフィールドの主要施設は南相馬市にある。',['○','×'],0,'南相馬市に主要な試験施設があり、浪江町にも広域飛行用の滑走路があります。','robotfac'],
  ['future','福島第一原子力発電所は南相馬市内にある。',['○','×'],1,'所在地は大熊町と双葉町で、南相馬市内ではありません。','tepco'],
  ['future','2011年の原発事故で、小高区全域が警戒区域に設定された。',['○','×'],0,'2011年4月22日、小高区全域と原町区の一部が警戒区域に設定されました。','evaczone'],
  ['future','南相馬で「復興」という営みが始まったのは、東日本大震災のときが初めてである。',['○','×'],1,'震災以前にも、飢饉後の村おこし政策として報徳仕法が導入されるなど、危機から暮らしを立て直してきた歴史があります。','houtoku'],
  ['town','南相馬市の「市の花」は？',['さくら','はまなす','ききょう'],0,'市の花は、特定の種類や品種に限定しない総称としての「さくら」です。','symbol'],
  ['town','南相馬市の「市の魚」は？',['さけ','かつお','あゆ'],0,'市の魚はさけ。小高川・真野川・新田川などを遡上し、海・川・山をつなぐ象徴です。','symbol'],
  ['nomaoi','相馬野馬追は何日間にわたって行われる？',['3日間','1日だけ','7日間'],0,'毎年5月の最終土・日・月曜日、3日間にわたって執り行われます。','nomaoi'],
  ['nomaoi','2日目の甲冑競馬・神旗争奪戦を雲雀ヶ原祭場地で見るには、観覧チケットが必要である。',['○','×'],0,'公式案内では、2日目の甲冑競馬と神旗争奪戦の観覧にチケットが必要とされています。','ticket'],
  ['ancient','泉官衙遺跡は、古代の何の跡？',['行方郡の役所','武士の山城','港の市場'],0,'奈良・平安時代に行方郡を治めた郡役所跡です。','izumi'],
  ['ancient','横大道製鉄遺跡で鉄の原料に使われたものは？',['海浜の砂鉄','輸入した鉄鉱石','隕石'],0,'海浜で豊富に採れた砂鉄を原料に、奈良・平安時代の鉄づくりが行われました。','odaka'],

  updateCount();loadCommunityQuestions().finally(()=>{updateCount();home()});
  </script>
</body>
