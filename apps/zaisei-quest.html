<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>財政クエスト — まちのお金がわかると、まちが見えてくる</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F0E7;
  --paper-deep:#E8E4D6;
  --card:#FBF9F2;
  --ink:#28251F;
  --ai:#1E3A55;
  --ai-light:#3D5C7A;
  --ai-wash:#DDE4EA;
  --shu:#B5352F;
  --shu-soft:#C9605B;
  --kin:#A8842C;      /* 金 rank accent */
  --line:#CBC5B3;
  --ok:#3D6B4F;
  --ok-wash:#E3EDE6;
  --bad-wash:#F4E3E2;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Zen Kaku Gothic New',sans-serif;
  font-size:16px;line-height:1.85;min-height:100vh;
}
.wrap{max-width:760px;margin:0 auto;padding:0 20px 90px;}

/* ===== header / status bar ===== */
header.top{
  border-bottom:3px double var(--ink);
  padding:22px 0 14px;margin-bottom:6px;
}
.top-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;}
header.top h1{
  font-family:'Shippori Mincho',serif;font-weight:800;font-size:24px;letter-spacing:.12em;cursor:pointer;
}
header.top h1 span{color:var(--shu);}
header.top .tag{font-size:11px;letter-spacing:.18em;color:var(--ai-light);}
.status{
  display:flex;align-items:center;gap:14px;margin-top:12px;flex-wrap:wrap;
}
.rank-badge{
  display:inline-flex;align-items:center;gap:8px;
  border:1.5px solid var(--ink);background:var(--card);
  padding:5px 14px 5px 10px;font-size:13px;font-weight:700;letter-spacing:.08em;
}
.rank-badge .rk-mark{
  width:20px;height:20px;border-radius:50%;
  border:2px solid var(--shu);color:var(--shu);
  font-size:10px;display:flex;align-items:center;justify-content:center;
  font-family:'Shippori Mincho',serif;font-weight:800;transform:rotate(-8deg);
}
.rank-badge.master{border-color:var(--kin);color:var(--kin);}
.rank-badge.master .rk-mark{border-color:var(--kin);color:var(--kin);}
.xp-wrap{flex:1;min-width:180px;}
.xp-label{font-size:11px;letter-spacing:.1em;color:#7d7867;display:flex;justify-content:space-between;}
.xp-bar{height:9px;background:var(--paper-deep);border:1px solid var(--line);margin-top:3px;}
.xp-fill{height:100%;background:linear-gradient(90deg,var(--ai),var(--ai-light));transition:width .6s cubic-bezier(.3,1,.4,1);}

/* ===== level-up toast ===== */
#toast{
  position:fixed;left:50%;top:18%;transform:translateX(-50%) scale(.8);
  background:var(--ink);color:#fff;padding:18px 30px;
  font-family:'Shippori Mincho',serif;letter-spacing:.1em;text-align:center;
  opacity:0;pointer-events:none;z-index:50;
  border:1px solid var(--kin);
  transition:opacity .3s, transform .3s;
}
#toast.on{opacity:1;transform:translateX(-50%) scale(1);}
#toast .t-small{font-size:11px;color:var(--kin);letter-spacing:.3em;}
#toast .t-big{font-size:21px;font-weight:800;margin-top:4px;}
@media (prefers-reduced-motion:reduce){#toast{transition:none;}}

/* ===== home ===== */
.intro{padding:20px 0 4px;font-size:14.5px;color:#4d4a40;}
.intro strong{color:var(--ink);}
.rank-ladder{
  display:flex;gap:0;margin:18px 0 8px;border:1px solid var(--line);background:var(--card);
  overflow:hidden;
}
.rung{
  flex:1;text-align:center;padding:10px 2px 8px;font-size:10.5px;letter-spacing:.03em;
  color:#9a947f;border-right:1px dashed var(--line);position:relative;line-height:1.5;
}
.rung:last-child{border-right:none;}
.rung .r-name{font-weight:700;font-size:11.5px;display:block;}
.rung.reached{color:var(--ink);background:var(--ai-wash);}
.rung.current{background:var(--ai);color:#fff;}
.rung.current .r-name{color:#fff;}
.rung.master-r.reached{background:var(--kin);color:#fff;}
.ladder-note{font-size:11.5px;color:#8b8571;margin-bottom:20px;}

.stampbook{
  display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
  background:var(--paper-deep);border:1px solid var(--line);
  padding:12px;margin:14px 0 24px;
}
.stamp-slot{
  aspect-ratio:1;border:1px dashed var(--line);
  display:flex;align-items:center;justify-content:center;
  position:relative;background:var(--paper);
}
.stamp-slot .num{font-size:9px;color:#9a947f;position:absolute;top:3px;left:5px;letter-spacing:.08em;}
.seal{
  width:72%;aspect-ratio:1;border-radius:50%;
  border:2.5px solid var(--shu);color:var(--shu);
  display:flex;align-items:center;justify-content:center;
  font-family:'Shippori Mincho',serif;font-weight:800;font-size:13px;
  transform:rotate(-8deg);letter-spacing:.03em;
  box-shadow:inset 0 0 0 1.5px rgba(181,53,47,.25);
  animation:stampin .45s cubic-bezier(.2,1.6,.4,1) both;
  writing-mode:vertical-rl;line-height:1.05;padding:2px;text-align:center;
}
.seal.gold{border-color:var(--kin);color:var(--kin);box-shadow:inset 0 0 0 1.5px rgba(168,132,44,.3);}
@keyframes stampin{
  0%{transform:rotate(-8deg) scale(2.2);opacity:0;}
  60%{transform:rotate(-8deg) scale(.92);opacity:1;}
  100%{transform:rotate(-8deg) scale(1);}
}
@media (prefers-reduced-motion:reduce){.seal{animation:none;}}

.chapter-list{list-style:none;display:flex;flex-direction:column;gap:10px;}
.chapter-card{
  border:1px solid var(--line);background:var(--card);
  padding:15px 18px;cursor:pointer;
  display:flex;gap:14px;align-items:center;
  transition:border-color .15s;
}
.chapter-card:hover,.chapter-card:focus-visible{border-color:var(--ai);}
.chapter-card:focus-visible{outline:2px solid var(--ai);outline-offset:2px;}
.chapter-card.locked{opacity:.5;cursor:default;}
.chapter-card.locked:hover{border-color:var(--line);}
.chapter-card.final{border:1.5px solid var(--kin);}
.ch-no{
  font-family:'Shippori Mincho',serif;font-weight:800;color:var(--ai);
  font-size:12px;letter-spacing:.08em;border-right:1px solid var(--line);
  padding-right:13px;writing-mode:vertical-rl;min-height:54px;flex-shrink:0;
}
.chapter-card.final .ch-no{color:var(--kin);}
.ch-body h3{font-family:'Shippori Mincho',serif;font-size:16.5px;font-weight:600;}
.ch-body p{font-size:12.5px;color:#6f6a5d;line-height:1.6;}
.ch-state{margin-left:auto;font-size:11px;letter-spacing:.08em;color:#9a947f;white-space:nowrap;text-align:right;flex-shrink:0;}
.ch-state.done{color:var(--shu);font-weight:700;}
.ch-state .xp-got{display:block;font-size:10px;color:var(--ai-light);}

/* ===== chapter view ===== */
.crumb{font-size:12px;color:var(--ai-light);padding:14px 0 2px;letter-spacing:.06em;}
.crumb a{color:var(--ai-light);cursor:pointer;text-decoration:underline;text-underline-offset:3px;}
h2.ch-title{font-family:'Shippori Mincho',serif;font-size:23px;font-weight:800;letter-spacing:.05em;padding:18px 0 0;}
h2.ch-title .lead{display:block;font-size:11.5px;color:var(--ai-light);letter-spacing:.22em;font-weight:500;margin-bottom:2px;}
.stage-tabs{display:flex;border-bottom:1px solid var(--ink);margin:10px 0 0;}
.stage-tab{
  flex:1;text-align:center;padding:10px 4px 8px;
  font-family:'Shippori Mincho',serif;font-size:13.5px;letter-spacing:.12em;
  color:#8b8571;border:none;background:none;cursor:pointer;
  border-bottom:3px solid transparent;margin-bottom:-1px;
}
.stage-tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--shu);font-weight:600;}
.stage-tab:focus-visible{outline:2px solid var(--ai);outline-offset:-2px;}
.stage{padding:24px 0 0;}

.lesson h4{
  font-family:'Shippori Mincho',serif;font-size:16.5px;font-weight:600;
  margin:28px 0 8px;padding-left:12px;border-left:4px solid var(--ai);
}
.lesson h4:first-child{margin-top:4px;}
.lesson p{margin:0 0 13px;font-size:14.5px;}
.lesson .kp{background:var(--ai-wash);border-left:4px solid var(--ai);padding:11px 15px;margin:14px 0;font-size:13.5px;}
.lesson .kp strong{color:var(--ai);}
.lesson .fun{background:#F0EAD8;border-left:4px solid var(--kin);padding:11px 15px;margin:14px 0;font-size:13.5px;}
.lesson .fun strong{color:var(--kin);}
.term{border-bottom:2px dotted var(--shu-soft);font-weight:700;}
table.zaisei{width:100%;border-collapse:collapse;margin:13px 0;font-size:13px;}
table.zaisei th,table.zaisei td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top;}
table.zaisei th{background:var(--paper-deep);font-weight:700;white-space:nowrap;}
table.zaisei td.num{text-align:right;font-family:'IBM Plex Mono',monospace;}

.ex-box{border:1px solid var(--ink);background:var(--card);padding:20px;margin:14px 0;}
.ex-box h5{font-family:'Shippori Mincho',serif;font-size:15px;margin-bottom:10px;letter-spacing:.05em;}
.ex-q{font-size:14px;margin-bottom:12px;}
.ex-input-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0;}
input[type="number"]{
  font-family:'IBM Plex Mono',monospace;font-size:16px;
  padding:8px 10px;border:1px solid var(--ink);background:#fff;width:130px;color:var(--ink);
}
input[type="number"]:focus-visible{outline:2px solid var(--ai);}
.unit{font-size:14px;color:#6f6a5d;}
button.act{
  font-family:'Zen Kaku Gothic New',sans-serif;font-size:14px;font-weight:700;letter-spacing:.08em;
  background:var(--ai);color:#fff;border:none;padding:10px 26px;cursor:pointer;
}
button.act:hover{background:var(--ai-light);}
button.act:focus-visible{outline:2px solid var(--shu);outline-offset:2px;}
button.act.ghost{background:none;color:var(--ai);border:1px solid var(--ai);}
button.act.gold{background:var(--kin);}
.fb{margin-top:12px;padding:12px 14px;font-size:13.5px;display:none;}
.fb.on{display:block;}
.fb.good{background:var(--ok-wash);border-left:4px solid var(--ok);}
.fb.bad{background:var(--bad-wash);border-left:4px solid var(--shu);}

.q-block{border-bottom:1px solid var(--line);padding:18px 0;}
.q-block .qt{font-size:14.5px;font-weight:700;margin-bottom:11px;}
.q-block .qt .qno{color:var(--ai);font-family:'Shippori Mincho',serif;margin-right:8px;}
.opts{display:flex;flex-direction:column;gap:8px;}
.opt{
  display:flex;gap:10px;align-items:flex-start;
  border:1px solid var(--line);background:var(--card);
  padding:10px 14px;cursor:pointer;font-size:13.5px;line-height:1.6;
}
.opt:hover{border-color:var(--ai);}
.opt input{margin-top:5px;accent-color:var(--ai);}
.opt.correct{border-color:var(--ok);background:var(--ok-wash);}
.opt.wrong{border-color:var(--shu);background:var(--bad-wash);}
.expl{display:none;margin-top:10px;font-size:12.5px;color:#4d4a40;background:var(--paper-deep);padding:10px 14px;}
.expl.on{display:block;}
.quiz-result{text-align:center;padding:28px 0 8px;display:none;}
.quiz-result.on{display:block;}
.quiz-result .score{font-family:'Shippori Mincho',serif;font-size:34px;font-weight:800;}
.quiz-result .msg{font-size:14px;margin:8px 0 6px;}
.quiz-result .xp-msg{font-size:13px;color:var(--ai);font-weight:700;margin-bottom:16px;}
.quiz-result .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.center{text-align:center;margin:24px 0 8px;}
.next-hint{font-size:12.5px;color:#8b8571;margin-top:10px;}
.notice{font-size:11.5px;color:#8b8571;margin-top:22px;border-top:1px solid var(--line);padding-top:12px;line-height:1.7;}

/* ===== certificate ===== */
.cert{
  border:3px double var(--kin);background:var(--card);
  padding:36px 26px;text-align:center;margin:20px 0;
}
.cert .c-eyebrow{font-size:11px;letter-spacing:.4em;color:var(--kin);}
.cert .c-title{font-family:'Shippori Mincho',serif;font-size:30px;font-weight:800;letter-spacing:.15em;margin:8px 0 14px;}
.cert p{font-size:13.5px;}
.cert .c-seal{margin:18px auto 0;width:76px;height:76px;border-radius:50%;
  border:3px solid var(--kin);color:var(--kin);display:flex;align-items:center;justify-content:center;
  font-family:'Shippori Mincho',serif;font-weight:800;font-size:15px;transform:rotate(-8deg);
  writing-mode:vertical-rl;line-height:1.1;}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="top-row">
      <h1 id="home-link" tabindex="0" role="button" aria-label="ホームへ戻る">財政<span>クエスト</span></h1>
      <div class="tag">まちのお金がわかると、まちが見えてくる</div>
    </div>
    <div class="status">
      <div class="rank-badge" id="rank-badge"><span class="rk-mark">位</span><span id="rank-name">一般市民</span></div>
      <div class="xp-wrap">
        <div class="xp-label"><span>経験値</span><span id="xp-text" class="mono">0 XP</span></div>
        <div class="xp-bar"><div class="xp-fill" id="xp-fill" style="width:0%"></div></div>
      </div>
    </div>
  </header>
  <main id="app"></main>
</div>
<div id="toast" role="status"><div class="t-small">RANK UP</div><div class="t-big" id="toast-rank"></div></div>

<script>
/* ================= ranks & xp ================= */
const RANKS = [
  {name:"一般市民", xp:0,   note:"ここから出発"},
  {name:"財政見習い", xp:90, note:""},
  {name:"予算ウォッチャー", xp:220, note:""},
  {name:"新米議員級", xp:380, note:""},
  {name:"ベテラン議員級", xp:560, note:""},
  {name:"財政マスター", xp:null, note:"最終試験合格で認定"}
];
const XP_LESSON=10, XP_EX=20, XP_Q=10, XP_PERFECT=10;
const PASS_LINE=4;

/* ================= chapters ================= */
const CHAPTERS = [
{
  id:"c1", stampLabel:"歳入",
  title:"まちの家計簿・収入編", lead:"第一章",
  desc:"まちのお金はどこから来る? 4つの財布と「自立度」の測り方。",
  lesson:`
  <h4>まちにも家計簿がある</h4>
  <p>あなたのまちは、毎年数百億円のお金を集めて使っています。その出どころは大きく4つ。家計にたとえると、こうなります。</p>
  <table class="zaisei">
    <tr><th>① 地方税</th><td><span class="term">自分の給料</span>。住民税・固定資産税など。使い道は自由。</td></tr>
    <tr><th>② 地方交付税</th><td><span class="term">実家からの仕送り</span>(国から)。使い道は自由だが、額を決めるのは実家。</td></tr>
    <tr><th>③ 国庫支出金など</th><td><span class="term">用途指定のお祝い金</span>。「学費に使ってね」と使い道が決められた補助金。</td></tr>
    <tr><th>④ 地方債(市債など)</th><td><span class="term">ローン</span>。将来の自分(=将来世代)が返す借金。</td></tr>
  </table>
  <h4>「自立度」を測るものさし</h4>
  <p>①に手数料などを足したものを<span class="term">自主財源</span>、②③④を<span class="term">依存財源</span>と呼びます。収入全体に占める自主財源の割合が<span class="term">自主財源比率</span>——まちの経済的な自立度です。</p>
  <div class="kp"><strong>ここが本質:</strong>自主財源比率が低いまちは、国の方針ひとつで事業が左右されます。「自分のまちのことを自分で決められる度合い」は、実はこの数字で決まっています。</div>
  <div class="fun"><strong>豆知識:</strong>全国にはごくわずかに、交付税(仕送り)ゼロでやっていける「不交付団体」があります。多くは大企業の工場や発電所を抱えるまち。全国1,700超の市町村のうち、ほんの数十だけです。</div>
  `,
  exercise:{
    intro:"架空の「あおぞら市」の収入(サンプル)。自立度を計算してみましょう。",
    table:[["地方税","96億円"],["手数料・使用料など","4億円"],["地方交付税","70億円"],["国庫支出金など","60億円"],["地方債","20億円"],["収入合計","250億円"]],
    question:"自主財源比率は何%?(整数で。自主財源=地方税+手数料等)",
    answer:40, tolerance:0, unit:"%",
    good:"正解! (96+4)÷250=40%。全国の市の平均はおおむね50%前後。あおぞら市はやや仕送り頼みの体質です。",
    bad:"自主財源=96+4=100億円。÷250億円で40%です。交付税や補助金は「依存財源」なので分子に入れません。"
  },
  quiz:[
    {q:"使い道が指定されている「ひも付き」のお金は?",opts:["地方税","地方交付税","国庫支出金","手数料収入"],a:2,e:"国庫支出金は特定事業のための補助金。他の用途には使えません。交付税は使い道自由です。"},
    {q:"地方交付税を家計にたとえると?",opts:["自分の給料","使い道自由な仕送り(額は送る側が決める)","住宅ローン","宝くじの当せん金"],a:1,e:"使途は自由ですが、いくら来るかは国の算定次第。ここが「依存」と言われる理由です。"},
    {q:"自主財源比率が低いまちで起こりやすいのは?",opts:["借金が自動で消える","国の制度変更にまちの計画が振り回される","住民税が必ず上がる","選挙がなくなる"],a:1,e:"依存財源が主だと、国の予算方針の変化がそのまま、まちの事業の存続に直結します。"},
    {q:"地方債(借金)の返済を実質的に負担するのは?",opts:["国だけ","借りた年の住民だけ","将来の住民(将来世代)","銀行"],a:2,e:"borrowは今、返済は未来。道路や施設の借金は、将来の税金から返されます。"},
    {q:"「不交付団体」とは?",opts:["税金を集めないまち","交付税なしで標準的な行政を賄えるまち","借金が禁止されたまち","人口ゼロのまち"],a:1,e:"自前の税収が十分あるため仕送り(普通交付税)が来ないまち。全国でも少数派です。"}
  ]
},
{
  id:"c2", stampLabel:"歳出",
  title:"まちの家計簿・支出編", lead:"第二章",
  desc:"お金はどこへ消える? 削れない「固定費」の正体。",
  lesson:`
  <h4>支出は二つのメガネで見る</h4>
  <p><span class="term">目的別</span>(福祉・道路・教育…何のために)と<span class="term">性質別</span>(人件費・給付・借金返済…どんな性質か)。ニュースで見るのは目的別ですが、まちの体質を診るのは性質別です。</p>
  <h4>削れない三兄弟「義務的経費」</h4>
  <table class="zaisei">
    <tr><th>人件費</th><td>職員の給与など。家計でいう「生活の基本コスト」。</td></tr>
    <tr><th>扶助費</th><td>生活保護・子育て・障害福祉などの給付。国の制度で決まり、まちの判断では減らせない。全国的に増加中。</td></tr>
    <tr><th>公債費</th><td>過去の借金の返済。<span class="term">過去の決断の請求書</span>。</td></tr>
  </table>
  <p>この3つは法律や契約で支払いが決まっていて、簡単には削れません。支出の半分を超えてくると、まちの身動きが重くなります。</p>
  <h4>ハコモノの本当の値段</h4>
  <p>施設を建てる費用(建設事業費)は一回きりに見えます。でも完成した瞬間から、光熱費・修繕費・そして数十年後の建て替え費が<span class="term">毎年の固定費</span>に変わります。</p>
  <div class="kp"><strong>ここが本質:</strong>「無料の施設」は存在しません。建設費の2〜3倍の維持・更新費が、30〜50年かけて後からやってきます。これを<span class="term">ライフサイクルコスト</span>と呼びます。</div>

/* ================= state & storage ================= */
let progress = {};   // {c1:{stamped,best,xpGot:{lesson,ex,quiz}}, master:{passed,best}}
let xp = 0;
let persistMode = "none";

const store = {
  async get(k){
    try{ const v = localStorage.getItem(k); if(v!==null){persistMode="local";return v;} }catch(e){}
    try{ const r = await window.storage.get(k); if(r&&r.value!=null){persistMode="claude";return r.value;} }catch(e){}
    return null;
  },
  async set(k,v){
    try{ localStorage.setItem(k,v); persistMode="local"; return; }catch(e){}
    try{ await window.storage.set(k,v); persistMode="claude"; return; }catch(e){}
    persistMode="none";
  }
};

async function loadState(){
  const v = await store.get("zaisei-quest");
  if(v){ try{ const o=JSON.parse(v); progress=o.progress||{}; xp=o.xp||0; }catch(e){} }
}
async function saveState(){
  await store.set("zaisei-quest", JSON.stringify({progress,xp}));
}

/* ================= rank logic ================= */
function currentRank(){
  if(progress.master && progress.master.passed) return 5;
  let r=0;
  for(let i=0;i<RANKS.length-1;i++){ if(RANKS[i].xp!==null && xp>=RANKS[i].xp) r=i; }
  return r;
}
function nextThreshold(){
  const r=currentRank();
  if(r>=4) return null;
  return RANKS[r+1].xp;
}
let lastRank = 0;

function updateStatus(animate){
  const r = currentRank();
  const badge=document.getElementById("rank-badge");
  document.getElementById("rank-name").textContent = RANKS[r].name;
  badge.classList.toggle("master", r===5);
  badge.querySelector(".rk-mark").textContent = r===5?"極":"位";
  const nt = nextThreshold();
  const base = RANKS[r].xp ?? 560;
  let pct;
  if(r===5) pct=100;
  else if(nt===null) pct = progress.master&&progress.master.passed?100:96;
  else pct = Math.min(100, Math.round((xp-base)/(nt-base)*100));
  document.getElementById("xp-fill").style.width = pct+"%";
  document.getElementById("xp-text").textContent = xp+" XP" + (nt?` ／ 次の位まで ${Math.max(0,nt-xp)}`:"");
  if(animate && r>lastRank){
    const t=document.getElementById("toast");
    document.getElementById("toast-rank").textContent = RANKS[r].name+" に昇格";
    t.classList.add("on");
    setTimeout(()=>t.classList.remove("on"), 2600);
  }
  lastRank=r;
}
async function addXp(n){
  xp+=n;
  await saveState();
  updateStatus(true);
}

/* ================= rendering ================= */
const app=document.getElementById("app");
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
const KANJI=["一","二","三","四","五","六","七","八"];

function renderHome(){
  const r=currentRank();
  const rungs = RANKS.map((rk,i)=>{
    const cls = ["rung"];
    if(i<=r) cls.push("reached");
    if(i===r) cls.push("current");
    if(i===5) cls.push("master-r");
    return `<div class="${cls.join(" ")}"><span class="r-name">${rk.name}</span>${rk.xp!==null?rk.xp+"XP〜":"最終試験"}</div>`;
  }).join("");

  const slots = CHAPTERS.map((c,i)=>{
    const done = progress[c.id]&&progress[c.id].stamped;
    return `<div class="stamp-slot"><span class="num">其の${KANJI[i]}</span>${done?`<div class="seal">${c.stampLabel}<br>済</div>`:""}</div>`;
  }).join("");

  const masterDone = progress.master&&progress.master.passed;
  const allStamped = CHAPTERS.every(c=>progress[c.id]&&progress[c.id].stamped);

  const cards = CHAPTERS.map((c,i)=>{
    const st=progress[c.id];
    const done=st&&st.stamped;
    return `<li class="chapter-card" tabindex="0" role="button" data-ch="${i}">
      <div class="ch-no">第${KANJI[i]}章</div>
      <div class="ch-body"><h3>${c.title}</h3><p>${c.desc}</p></div>
      <div class="ch-state ${done?"done":""}">${done?`合格（${st.best}/5）`:(st&&st.best!=null?`挑戦中（最高${st.best}/5）`:"未読")}</div>
    </li>`;
  }).join("");

  app.innerHTML = `
    <p class="intro">全八章+最終試験。読む(<strong>+${XP_LESSON}XP</strong>)、数字を解く(<strong>+${XP_EX}XP</strong>)、試験に挑む(正解ごとに<strong>+${XP_Q}XP</strong>、全問正解ボーナスあり)。経験値で位が上がり、最終試験に合格すると<strong>財政マスター</strong>認定です。</p>
    <div class="rank-ladder">${rungs}</div>
    <p class="ladder-note">位は経験値で自動昇格。財政マスターのみ、最終試験(${MASTER_EXAM.passLine}/10で合格)が必要です。</p>
    <div class="stampbook" aria-label="合格印の記録">${slots}</div>
    <ul class="chapter-list">
      ${cards}
      <li class="chapter-card final ${allStamped?"":"locked"}" tabindex="${allStamped?0:-1}" role="button" data-master="1" aria-disabled="${!allStamped}">
        <div class="ch-no">最終</div>
        <div class="ch-body"><h3>財政マスター試験</h3><p>${allStamped?"全章の知識を総動員する10問。8問正解で「財政マスター」認定。":"全八章の合格印を集めると挑戦できます。"}</p></div>
        <div class="ch-state ${masterDone?"done":""}">${masterDone?"マスター認定済":(allStamped?"挑戦可能":"未開放")}</div>
      </li>
    </ul>
    <p class="notice">本講座の数値例はすべて学習用の架空サンプルです。実在のまちの財政は「決算カード」「財政状況資料集」(いずれも無料公開)で確認できます。${persistMode==="none"?"<br>※この環境では進捗保存が利用できないため、記録はこの画面を開いている間のみ有効です。":""}</p>
  `;
  app.querySelectorAll(".chapter-card[data-ch]").forEach(el=>{
    const go=()=>renderChapter(+el.dataset.ch,"lesson");
    el.addEventListener("click",go);
    el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go();}});
  });
  const mc=app.querySelector("[data-master]");
  if(allStamped){
    const go=()=>renderMaster();
    mc.addEventListener("click",go);
    mc.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go();}});
  }
  window.scrollTo(0,0);
}

function renderChapter(idx,stage){
  const c=CHAPTERS[idx];
  app.innerHTML=`
    <div class="crumb"><a id="back">← 目次へ戻る</a></div>
    <h2 class="ch-title"><span class="lead">第${KANJI[idx]}章</span>${c.title}</h2>
    <div class="stage-tabs" role="tablist">
      <button class="stage-tab" role="tab" data-s="lesson" aria-selected="${stage==="lesson"}">座学</button>
      <button class="stage-tab" role="tab" data-s="exercise" aria-selected="${stage==="exercise"}">数字読み</button>
      <button class="stage-tab" role="tab" data-s="quiz" aria-selected="${stage==="quiz"}">章末試験</button>
    </div>
    <div class="stage" id="stage"></div>`;
  document.getElementById("back").addEventListener("click",renderHome);
  app.querySelectorAll(".stage-tab").forEach(b=>b.addEventListener("click",()=>renderChapter(idx,b.dataset.s)));
  const el=document.getElementById("stage");
  if(stage==="lesson") renderLesson(el,idx);
  else if(stage==="exercise") renderExercise(el,idx);
  else renderQuiz(el,idx);
  window.scrollTo(0,0);
}

function ensureXpFlags(cid){
  if(!progress[cid]) progress[cid]={stamped:false,best:null,got:{}};
  if(!progress[cid].got) progress[cid].got={};
  return progress[cid];
}

function renderLesson(el,idx){
  const c=CHAPTERS[idx];
  const st=ensureXpFlags(c.id);
  el.innerHTML=`<div class="lesson">${c.lesson}</div>
    <div class="center"><button class="act" id="to-ex">${st.got.lesson?"数字読みへ進む":"読了して数字読みへ (+"+XP_LESSON+"XP)"}</button></div>`;
  el.querySelector("#to-ex").addEventListener("click",async()=>{
    if(!st.got.lesson){ st.got.lesson=true; await addXp(XP_LESSON); }
    renderChapter(idx,"exercise");
  });
}

function renderExercise(el,idx){
  const c=CHAPTERS[idx];
  const st=ensureXpFlags(c.id);
  const rows=c.exercise.table.map(r=>`<tr><th>${r[0]}</th><td class="num">${r[1]}</td></tr>`).join("");
  el.innerHTML=`
    <div class="ex-box">
      <h5>数字読み演習 ${st.got.ex?"（クリア済）":"（正解で +"+XP_EX+"XP）"}</h5>
      <p class="ex-q">${c.exercise.intro}</p>
      <table class="zaisei">${rows}</table>
      <p class="ex-q">${c.exercise.question}</p>
      <div class="ex-input-row">
        <input type="number" id="ex-ans" inputmode="decimal" step="any" aria-label="解答を入力">
        <span class="unit">${c.exercise.unit}</span>
        <button class="act" id="ex-check">答え合わせ</button>
      </div>
      <div class="fb" id="ex-fb"></div>
    </div>
    <div class="center"><button class="act ghost" id="to-quiz">章末試験へ進む</button></div>`;
  const fb=el.querySelector("#ex-fb");
  el.querySelector("#ex-check").addEventListener("click",async()=>{
    const v=parseFloat(el.querySelector("#ex-ans").value);
    if(isNaN(v)){fb.className="fb bad on";fb.textContent="数値を入力してください。";return;}
    if(Math.abs(v-c.exercise.answer)<=c.exercise.tolerance){
      fb.className="fb good on";
      fb.textContent=c.exercise.good + (st.got.ex?"":" [+"+XP_EX+"XP]");
      if(!st.got.ex){ st.got.ex=true; await addXp(XP_EX); }
    }else{
      fb.className="fb bad on";fb.textContent=c.exercise.bad;
    }
  });
  el.querySelector("#ex-ans").addEventListener("keydown",e=>{if(e.key==="Enter")el.querySelector("#ex-check").click();});
  el.querySelector("#to-quiz").addEventListener("click",()=>renderChapter(idx,"quiz"));
}

function buildQuizHtml(questions){
  return questions.map((q,qi)=>{
    const opts=q.opts.map((o,oi)=>`
      <label class="opt" data-q="${qi}" data-o="${oi}">
        <input type="radio" name="q${qi}" value="${oi}"><span>${esc(o)}</span>
      </label>`).join("");
    return `<div class="q-block"><div class="qt"><span class="qno">問${qi+1}</span>${esc(q.q)}</div>
      <div class="opts">${opts}</div><div class="expl" id="expl-${qi}">${esc(q.e)}</div></div>`;
  }).join("");
}

function gradeQuiz(el,questions){
  let unanswered=false;
  questions.forEach((q,qi)=>{ if(!el.querySelector(`input[name="q${qi}"]:checked`)) unanswered=true; });
  if(unanswered){ alert("未回答の問題があります。すべて選んでから採点してください。"); return null; }
  let score=0;
  questions.forEach((q,qi)=>{
    const chosen=+el.querySelector(`input[name="q${qi}"]:checked`).value;
    el.querySelectorAll(`.opt[data-q="${qi}"]`).forEach(op=>{
      const oi=+op.dataset.o;
      if(oi===q.a) op.classList.add("correct");
      else if(oi===chosen) op.classList.add("wrong");
      op.querySelector("input").disabled=true;
    });
    el.querySelector(`#expl-${qi}`).classList.add("on");
    if(chosen===q.a) score++;
  });
  return score;
}

function renderQuiz(el,idx){
  const c=CHAPTERS[idx];
  const st=ensureXpFlags(c.id);
  el.innerHTML=`
    <p class="ex-q">全${c.quiz.length}問。${PASS_LINE}問正解で合格印。正解ごとに+${XP_Q}XP(過去の最高得点を超えた分だけ加算)、全問正解で+${XP_PERFECT}XPボーナス。</p>
    ${buildQuizHtml(c.quiz)}
    <div class="center"><button class="act" id="grade">採点する</button></div>
    <div class="quiz-result" id="result">
      <div class="score" id="score"></div>
      <div class="msg" id="rmsg"></div>
      <div class="xp-msg" id="xpmsg"></div>
      <div class="btns">
        <button class="act ghost" id="retry">もう一度</button>
        <button class="act" id="home2">目次へ</button>
      </div>
      <p class="next-hint" id="hint"></p>
    </div>`;
  el.querySelector("#grade").addEventListener("click",async()=>{
    const score=gradeQuiz(el,c.quiz);
    if(score===null)return;
    el.querySelector("#grade").style.display="none";
    const res=el.querySelector("#result");res.classList.add("on");
    el.querySelector("#score").textContent=`${score} / ${c.quiz.length}`;
    const passed=score>=PASS_LINE;
    const prevBest=st.best??0;
    let gained=0;
    if(score>prevBest){ gained=(score-prevBest)*XP_Q; }
    if(score===c.quiz.length && !st.got.perfect){ gained+=XP_PERFECT; st.got.perfect=true; }
    st.best=Math.max(prevBest,score);
    st.stamped=st.stamped||passed;
    if(gained>0) await addXp(gained); else await saveState();
    el.querySelector("#rmsg").textContent = passed?"合格。合格印が押されました。":"合格まであと一歩。解説を読んで再挑戦を。";
    el.querySelector("#xpmsg").textContent = gained>0?`+${gained} XP 獲得`: "";
    const allStamped=CHAPTERS.every(ch=>progress[ch.id]&&progress[ch.id].stamped);
    el.querySelector("#hint").textContent = passed
      ? (idx<CHAPTERS.length-1?`次は第${KANJI[idx+1]}章「${CHAPTERS[idx+1].title}」へ。`:(allStamped?"全章制覇! 最終試験「財政マスター試験」が開放されました。":""))
      : "";
    res.scrollIntoView({behavior:"smooth",block:"center"});
  });
  el.querySelector("#retry").addEventListener("click",()=>renderChapter(idx,"quiz"));
  el.querySelector("#home2").addEventListener("click",renderHome);
}

function renderMaster(){
  const done=progress.master&&progress.master.passed;
  app.innerHTML=`
    <div class="crumb"><a id="back">← 目次へ戻る</a></div>
    <h2 class="ch-title"><span class="lead">最終試験</span>財政マスター試験</h2>
    <div class="stage">
      ${done?renderCertHtml():""}
      <p class="ex-q" style="margin-top:14px;">全10問・${MASTER_EXAM.passLine}問正解で「財政マスター」認定。${done?"(すでに認定済みですが、何度でも腕試しできます)":"全八章の総合力が試されます。"}</p>
      ${buildQuizHtml(MASTER_EXAM.questions)}
      <div class="center"><button class="act gold" id="grade">採点する</button></div>
      <div class="quiz-result" id="result">
        <div class="score" id="score"></div>
        <div class="msg" id="rmsg"></div>
        <div class="xp-msg" id="xpmsg"></div>
        <div class="btns">
          <button class="act ghost" id="retry">もう一度</button>
          <button class="act" id="home2">目次へ</button>
        </div>
      </div>
      <div id="cert-slot"></div>
    </div>`;
  document.getElementById("back").addEventListener("click",renderHome);
  const el=app;
  el.querySelector("#grade").addEventListener("click",async()=>{
    const score=gradeQuiz(el,MASTER_EXAM.questions);
    if(score===null)return;
    el.querySelector("#grade").style.display="none";
    const res=el.querySelector("#result");res.classList.add("on");
    el.querySelector("#score").textContent=`${score} / 10`;
    const passed=score>=MASTER_EXAM.passLine;
    const prev=progress.master||{passed:false,best:0};
    let gained=0;
    if(score>(prev.best||0)) gained=(score-(prev.best||0))*XP_Q;
    const firstPass=passed&&!prev.passed;
    if(firstPass) gained+=50;
    progress.master={passed:prev.passed||passed,best:Math.max(prev.best||0,score)};
    if(gained>0) await addXp(gained); else await saveState();
    updateStatus(true);
    el.querySelector("#rmsg").textContent=passed?"合格。あなたは財政マスターです。":"あと一歩。各章を読み直して再挑戦を。";
    el.querySelector("#xpmsg").textContent=gained>0?`+${gained} XP 獲得${firstPass?"(認定ボーナス込み)":""}`:"";
    if(firstPass){ document.getElementById("cert-slot").innerHTML=renderCertHtml(); }
    res.scrollIntoView({behavior:"smooth",block:"center"});
  });
  el.querySelector("#retry").addEventListener("click",renderMaster);
  el.querySelector("#home2").addEventListener("click",renderHome);
  window.scrollTo(0,0);
}

function renderCertHtml(){
  return `<div class="cert">
    <div class="c-eyebrow">CERTIFICATE</div>
    <div class="c-title">財政マスター認定</div>
    <p>全八章の学びと最終試験を修めたことをここに認めます。<br>
    次の一歩は、あなたのまちの「決算カード」を開くこと。<br>
    数字を読める住民が一人増えるたび、まちのお金は少しずつ、みんなのものになります。</p>
    <div class="c-seal">財政<br>マスター</div>
  </div>`;
}

/* ================= boot ================= */
const homeLink=document.getElementById("home-link");
homeLink.addEventListener("click",renderHome);
homeLink.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();renderHome();}});

(async()=>{
  await loadState();
  lastRank=currentRank();
  updateStatus(false);
  renderHome();
})();
</script>
